# Example profile configuration ($DSH_HOME/profiles/<profile>/cordis.patch.yml).
# Replace <placeholders> before first start; see docs/006-deployment.md.
- id: webserver
  config:
    host: 127.0.0.1
    port: 3082
- id: dsh-superagent
  config:
    stateDir: <absolute path, for example /home/me/.dsh/state/superagent>
    # Low-balance warnings are on by default with the USD ladder $2 low / $1 top-up recommended / $0.50 critical,
    # checked every 30 minutes and announced at most every 6 hours per severity. Uncomment to change them; restart
    # dsh-superagent after editing. CNY is checked only when its ladder is set explicitly.
    # balance:
    #   enabled: true
    #   intervalMinutes: 30
    #   cooldownMinutes: 360
    #   thresholds:
    #     USD: { low: 2, recommend: 1, critical: 0.5 }
    #     # CNY: { low: <amount>, recommend: <amount>, critical: <amount> }  # all three, only if wanted
# Feishu is optional: uncomment to enable its Source, then set the bot's lark-cli on the Feishu Source.
# - id: dsh-superagent-feishu
#   disabled: false
