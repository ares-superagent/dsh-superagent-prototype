# Example profile configuration ($DSH_HOME/profiles/<profile>/cordis.patch.yml).
# Replace <placeholders> before first start; see docs/006-deployment.md.
- id: webserver
  config:
    host: 127.0.0.1
    port: 3082
- id: dsh-superagent
  config:
    stateDir: <absolute path, for example /home/me/.dsh/state/superagent>
    # Low-balance warnings are on by default: USD 5 and CNY 20, checked every 30 minutes, announced at most every 6 hours.
    # Uncomment to change them; restart dsh-superagent after editing.
    # balance:
    #   enabled: true
    #   intervalMinutes: 30
    #   cooldownMinutes: 360
    #   thresholds: { USD: 5, CNY: 20 }
# Feishu is optional: uncomment to enable its Source, then set the bot's lark-cli on the Feishu Source.
# - id: dsh-superagent-feishu
#   disabled: false
